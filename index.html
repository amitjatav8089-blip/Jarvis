<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS</title><style>body{margin:0;background:#000810;color:#00d4ff;font-family:monospace;display:flex;flex-direction:column;height:100vh}#hdr{padding:15px;border-bottom:1px solid #00d4ff33;font-size:20px;font-weight:bold;letter-spacing:4px}#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}.jb{background:#00d4ff11;border:1px solid #00d4ff33;padding:12px;border-radius:0 12px 12px 12px;font-size:14px}.ub{background:#0055ff22;border:1px solid #0088ff44;padding:12px;border-radius:12px 0 12px 12px;font-size:14px;align-self:flex-end;color:#88ccff}#bottom{padding:12px;border-top:1px solid #00d4ff33;display:flex;gap:8px}#inp{flex:1;background:#00d4ff0a;border:1px solid #00d4ff44;color:#00d4ff;padding:10px;font-family:monospace;font-size:14px;outline:none}#btn{background:#00d4ff22;border:1px solid #00d4ff66;color:#00d4ff;padding:10px 16px;cursor:pointer}</style></head><body><div id="hdr">⬡ J.A.R.V.I.S.</div><div id="chat"><div class="jb">JARVIS online Boss! Kya hukum hai? 🔴</div></div><div id="bottom"><input id="inp" placeholder="Kuch bhi poochho..."><button id="btn" onclick="send()">▶</button></div><script>let H=[];async function send(){let i=document.getElementById('inp'),t=i.value.trim();if(!t)return;i.value='';add('ub',t);H.push({role:'user',content:t});add('jb','...');let r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,system:'Tu JARVIS hai. User ko Boss bolo. Hindi/Hinglish mein baat karo. Helpful aur friendly raho.',messages:H})});let d=await r.json(),rep=d.content[0].text;document.querySelectorAll('.jb').forEach((e,i,a)=>{if(i===a.length-1)e.textContent=rep});H.push({role:'assistant',content:rep})}function add(c,t){let div=document.createElement('div');div.className=c;div.textContent=t;document.getElementById('chat').appendChild(div);document.getElementById('chat').scrollTop=9999}document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')send()})</script></body></html>
